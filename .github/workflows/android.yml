# Export a Quillfen APK and AAB (targetSdk 36) and capture phone-viewport screenshots.
# Release signing uses ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, and
# ANDROID_KEY_ALIAS when all three are set. Otherwise the APK/AAB are debug-signed.
name: android

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          [ -n "$SM" ] && [ -x "$SM" ]
          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;29.0.14206865"
          "$SM" --sdk_root="$ANDROID_HOME" --list_installed

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT="$(find "$RUNNER_TEMP/godot-bin" -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT"
          sudo mv "$GODOT" /usr/local/bin/godot
          godot --version

      - name: Export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-linux

      - name: Download export templates
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ ! -f "$DEST/android_source.zip" ]; then
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/godot-templates"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
            mkdir -p "$DEST"
            cp -R "$RUNNER_TEMP/godot-templates/templates/." "$DEST/"
          fi
          test -f "$DEST/android_source.zip"
          test -f "$DEST/android_debug.apk" || test -f "$DEST/android_release.apk" || ls "$DEST" | head

      - name: Export APK and AAB
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash ci/export_android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quillfen-android
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error

  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and a software GL stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri unzip curl ca-certificates
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT="$(find "$RUNNER_TEMP/godot-bin" -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT"
          sudo mv "$GODOT" /usr/local/bin/godot
          godot --version

      - name: Capture title and gameplay
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          godot --headless --path . --import --quit || godot --headless --path . --import
          xvfb-run -a -s "-screen 0 2560x1440x24" \
            godot --path . --audio-driver Dummy res://src/mobile/screenshot_runner.tscn
          test -s build/screenshots/title.png
          test -s build/screenshots/gameplay.png
          file build/screenshots/*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error
