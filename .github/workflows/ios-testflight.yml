# Export Quillfen with Godot, archive it, and upload to TestFlight.
# Skips cleanly when the App Store Connect API secrets are absent.
#
# Secrets (GitHub → Settings → Secrets → Actions; never commit them):
#   APPSTORE_API_KEY_P8       raw PEM or base64 of AuthKey_<KEYID>.p8
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
# The key needs Admin or App Manager so Xcode can cloud-sign.
# The App Store Connect *app record* must exist before the first upload.
name: ios-testflight

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  TEAM_ID: 38PT254HDZ
  BUNDLE_ID: es.verkvest.quillfen
  APP_VERSION: "0.1.0"
  GODOT_VERSION: "4.7.2"

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::App Store Connect API key secrets are not set – skipping signing and upload."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - name: Tools + Xcode 26 (App Store requires the iOS 26 SDK)
        if: env.HAS_KEY == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          python3 -m venv "$RUNNER_TEMP/asc-py"
          "$RUNNER_TEMP/asc-py/bin/pip" install pyjwt cryptography
          echo "$RUNNER_TEMP/asc-py/bin" >> "$GITHUB_PATH"

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-app"
          GODOT="$(find "$RUNNER_TEMP/godot-app" -type f -name Godot | head -1)"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Install export templates
        if: env.HAS_KEY == 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2

      - name: Download export templates
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          DEST="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          if [ ! -f "$DEST/ios.zip" ]; then
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/godot-templates"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
            mkdir -p "$DEST"
            cp -R "$RUNNER_TEMP/godot-templates/templates/." "$DEST/"
          fi
          ls "$DEST" | head

      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Register bundle id if missing
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          APP_NAME: Quillfen
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          test -f "$ASC_KEY_PATH"
          python3 ci/asc_ensure_bundle_id.py

      - name: Export Godot iOS project
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path . --import --quit || "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Quillfen
          find build/ios -maxdepth 3 -name '*.xcodeproj' -o -name '*.plist' | head -40

      - name: Stamp version, build number, and encryption flag
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          BUILD="${{ github.run_number }}"
          find build/ios -name '*.pbxproj' -print0 | while IFS= read -r -d '' proj; do
            sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = ${BUILD}/g" "$proj"
            sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${APP_VERSION}/g" "$proj"
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}/g" "$proj"
          done
          find build/ios \( -name 'Info.plist' -o -name '*-Info.plist' \) -print0 | while IFS= read -r -d '' plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${APP_VERSION}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" "$plist" || true
            /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"
          done

      - name: Archive (unsigned; distribution signing happens on export)
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROJ=$(find build/ios -name '*.xcodeproj' -maxdepth 2 | head -1)
          [ -n "$PROJ" ] || { echo "::error::Godot did not produce an Xcode project"; exit 1; }
          echo "Using $PROJ"
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1; next} flag && NF {print; exit}' | xargs)
          [ -n "$SCHEME" ] || { echo "::error::No Xcode scheme in $PROJ"; exit 1; }
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Quillfen.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SKIP_INSTALL=NO INSTALL_PATH=/Applications \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -80
          test ${PIPESTATUS[0]} -eq 0
          find "$RUNNER_TEMP/Quillfen.xcarchive" -maxdepth 3 | head -30
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/Quillfen.xcarchive/Info.plist"
          APP=$(find "$RUNNER_TEMP/Quillfen.xcarchive/Products" -name '*.app' -maxdepth 3 | head -1)
          [ -n "$APP" ] || { echo "::error::Archive has no iOS .app"; exit 1; }
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c Print "$PLIST" | head -40

      - name: Export with App Store distribution signing and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Quillfen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          if grep -q "ERROR" "$RUNNER_TEMP/upload.log"; then
            if grep -Eq "Cannot determine the Apple ID|No suitable application records|does not exist|Unable to find" "$RUNNER_TEMP/upload.log"; then
              echo "::error::No App Store Connect app record for $BUNDLE_ID yet. Create it in App Store Connect → Apps → + with bundle id $BUNDLE_ID (the bundle id itself is registered by this workflow), then re-run."
            fi
            exit 1
          fi
          echo "::notice::Uploaded $BUNDLE_ID $APP_VERSION (${{ github.run_number }}) to App Store Connect"

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_KEY == 'true'
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore

      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
